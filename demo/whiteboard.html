<!doctype html>
<!-- Source for demo/whiteboard.png (rendered at 1600x1000). Dates are relative ("by Friday") so the photo never goes stale. -->
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #8a8d91; }
  .board { position: absolute; inset: 28px; border: 14px solid #c9ccd1; border-radius: 10px;
           background: linear-gradient(160deg, #fdfdfb 0%, #f3f4f1 60%, #e9ebe7 100%); box-shadow: inset 0 0 60px rgba(0,0,0,.08); }
  .ink { font-family: "Segoe Print", "Comic Sans MS", cursive; font-weight: 700; color: #1b2a6b; position: absolute; left: 90px; }
  h1 { top: 40px; font-size: 64px; margin: 0; text-decoration: underline; }
  .l1 { top: 250px; } .l2 { top: 420px; } .l3 { top: 590px; }
  p { font-size: 50px; margin: 0; white-space: nowrap; }
  .red { color: #b3261e; } .green { color: #1b6b2f; }
</style></head><body>
<div class="board">
  <h1 class="ink">Offsite: next steps</h1>
  <p class="ink l1"><span class="red">TODO:</span> Ben: book the bus by Friday</p>
  <p class="ink l2"><span class="red">TODO:</span> Chloe: print the name badges by Monday</p>
  <p class="ink l3"><span class="green">DONE:</span> Maya has sent the invitations</p>
</div>
</body></html>
