<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; background: #f4f1ea; font-family: "Segoe Print", "Comic Sans MS", sans-serif; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; height: 760px; padding: 20px 30px; box-sizing: border-box; }
h1 { margin: 18px 30px 0; font-size: 34px; color: #222; }
.col { border-right: 4px solid #333; padding: 10px 22px; }
.col:last-child { border-right: none; }
.col h2 { font-size: 36px; margin: 0 0 18px; text-align: center; color: #1c3d8f; text-decoration: underline; }
.note { width: 300px; min-height: 120px; margin: 0 auto 22px; padding: 14px 16px; font-size: 25px; line-height: 1.25; color: #222; box-shadow: 3px 4px 0 rgba(0,0,0,.18); }
.y { background: #ffe066; transform: rotate(-1.5deg); }
.p { background: #ffc9de; transform: rotate(1.2deg); }
.g { background: #b2f2bb; transform: rotate(-0.8deg); }
.who { display: block; margin-top: 8px; font-weight: 700; color: #1c3d8f; }
</style></head><body>
<h1>Payments Migration Sprint Board (Sep 29)</h1>
<div class="board">
  <div class="col"><h2>TODO</h2>
    <div class="note y">Renew fraud vendor contract<span class="who">Sarah</span></div>
    <div class="note p">Write Checkout launch runbook<span class="who">Priya</span></div>
  </div>
  <div class="col"><h2>DOING</h2>
    <div class="note y">Load-test Auth Service with Redis Cache<span class="who">Tom</span></div>
  </div>
  <div class="col"><h2>DONE</h2>
    <div class="note g">Provision Redis Cache<span class="who">Raj</span></div>
    <div class="note g">Schedule PCI audit<span class="who">Mei</span></div>
    <div class="note g">Inventory Ledger integrations<span class="who">Ana</span></div>
  </div>
</div>
</body></html>
